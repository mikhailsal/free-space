[package]
name = "cleanup_probe_live"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "cleanup_probe_live"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
libc = "0.2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1.52", features = ["override"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"
