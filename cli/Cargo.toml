[package]
name = "freespace"
description = "Disk usage snapshot that is always ready: fast scan, cached snapshot, web GUI, --json for agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../README.md"

[[bin]]
name = "freespace"
path = "src/main.rs"

[dependencies]
freespace-core.workspace = true
clap = { version = "4.6", features = ["derive", "wrap_help"] }
clap_complete = "4.6"
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", features = ["rt", "net", "signal", "time", "macros", "process", "sync"] }
include_dir = "0.7"
serde_urlencoded = "0.7"
libc.workspace = true

[dev-dependencies]
jsonschema = { version = "0.60.0", default-features = false }
tempfile = "3"
