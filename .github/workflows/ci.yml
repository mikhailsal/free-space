name: ci

on:
  push:
    branches: [master]
  pull_request:

# every job reads the code only, except audit, which also writes its check (see there); the token stays out of
# .git/config, so the code a pull request runs (rust-diff, the tests) cannot read it there
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    # each rust-diff call has its own 300 s bound, not the job: a hang on every call would hold the runner for hours
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # build.rs bundles web/ with bun (eng D5)
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # T10: precheck and a disk that fills up mid-write, on a real tmpfs
      - name: fault injection on a full filesystem
        run: sudo scripts/fault-fs.sh target/debug/freespace
      # T4: a tmpfs mounted inside a scanned root, and refresh of its mount point
      - name: a mount inside a root
        run: sudo scripts/mount-fs.sh target/debug/freespace
      # refactor-guard's questions against head itself, on every PR: base must answer each as the harness expects, so a
      # PR that moves the CLI on must move scripts/rust-diff/questions.sh too, not leave it to the next refactor PR. Two
      # copies in two files, as refactor-guard runs them: an answer that holds the binary's own path shows here
      - name: rust-diff, head against itself
        run: |
          command -v sqlite3 >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq sqlite3; }
          mkdir -p "$RUNNER_TEMP/bin"
          cp target/debug/freespace "$RUNNER_TEMP/bin/base"
          cp target/debug/freespace "$RUNNER_TEMP/bin/head"
          scripts/rust-diff.sh "$RUNNER_TEMP/bin/base" "$RUNNER_TEMP/bin/head" "$RUNNER_TEMP/rust-diff"

  # The page: types, unit tests (format, router, hidden, contrast) and the
  # Playwright suite against a mocked /api at 1280, 700 and 360 px with axe.
  web:
    runs-on: ubuntu-latest
    # tests/unit runs scripts/rust-diff.sh on stub builds, some twenty times (rust-diff*.test.ts)
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      # The non-root install manifest tests read real ACLs; rust-diff stubs also need sqlite3.
      - run: |
          if ! command -v sqlite3 >/dev/null || ! command -v getfacl >/dev/null || ! command -v setfacl >/dev/null; then
            sudo timeout 180 apt-get update -q
            sudo env DEBIAN_FRONTEND=noninteractive timeout 180 apt-get install -yq sqlite3 acl
          fi
      - run: bun test tests/unit
      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  # rust-version in Cargo.toml is a promise: let-chains need 1.88.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: cargo check --workspace --all-targets

  # The release archives are static musl builds with mimalloc replacing
  # malloc: the whole suite runs against that binary too.
  musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: sudo apt-get install -y musl-tools
      - run: cargo test --workspace --target x86_64-unknown-linux-musl

  # Building without bun must stop with the install hint, not a cryptic error.
  no-bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build fails with the bun install hint
        run: |
          if BUN=/nonexistent/bun cargo build -p freespace 2> build.log; then
            echo "built without bun"; exit 1
          fi
          grep -F "https://bun.sh/install" build.log

  audit:
    runs-on: ubuntu-latest
    # audit-check publishes advisory checks (falling back to its log when a PR token is denied): without checks: write
    # the first advisory fails the job on master with a 403 instead. The token can write checks here, so the action is
    # pinned to a commit: a moved v2 tag must not get that token.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # the action installs cargo-audit with an unlocked cargo install when it is not on PATH, and the build's
      # scripts would inherit the token from the action's environment: install it here, locked and without the token
      - name: install cargo-audit
        run: cargo install --locked --version =0.22.2 cargo-audit
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # .shellcheckrc lets it follow what scripts/rust-diff.sh sources from scripts/rust-diff/
      - run: shellcheck install.sh scripts/*.sh scripts/rust-diff/*.sh

  # T36/T37/T44 on a real systemd VM: install.sh from a local release layout
  # (no TTY + no sudo → the escalation line; fresh install; rerun), first scan
  # through the unit, serve, doctor, uninstall; afterwards nothing from the
  # file-mode table may remain.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # the same static build the release archive carries
      - run: sudo apt-get install -y musl-tools
      - run: cargo build --release --target x86_64-unknown-linux-musl
      # Hosted runners leave /usr/local/bin writable by the runner user, which
      # install-timer rightly refuses (D22); give it the stock ownership.
      - name: root-only /usr/local
        run: |
          sudo chown root:root /usr/local /usr/local/bin
          sudo chmod go-w /usr/local /usr/local/bin
      - name: a release layout like GitHub's, from this build
        run: |
          a=freespace-x86_64-unknown-linux-musl.tar.gz
          d=/tmp/releases
          V=$(target/x86_64-unknown-linux-musl/release/freespace --version | cut -d ' ' -f 2)
          echo "V=$V" >> "$GITHUB_ENV"
          mkdir -p "$d/latest/download" "$d/download/v$V" /tmp/pkg/freespace-x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/freespace LICENSE README.md /tmp/pkg/freespace-x86_64-unknown-linux-musl/
          tar -C /tmp/pkg -czf "$d/latest/download/$a" freespace-x86_64-unknown-linux-musl
          (cd "$d/latest/download" && sha256sum "$a" > "$a.sha256")
          cp "$d/latest/download/"* "$d/download/v$V/"
          chmod -R a+rX "$d"
      # Keep the root comparator's report contract current on every PR, before
      # install.sh writes to this disposable runner. The same binary fills both slots.
      - name: rust-install-diff, head against itself
        run: |
          if ! command -v getfacl >/dev/null || ! command -v setfacl >/dev/null; then
            sudo timeout 180 apt-get update -q
            sudo env DEBIAN_FRONTEND=noninteractive timeout 180 apt-get install -yq acl
          fi
          for path in /usr/local/share \
            /usr/local/share/bash-completion /usr/local/share/bash-completion/completions \
            /usr/local/share/zsh /usr/local/share/zsh/site-functions \
            /usr/local/share/fish /usr/local/share/fish/vendor_completions.d; do
            if [ -e "$path" ] || [ -L "$path" ]; then
              [ -d "$path" ] && [ ! -L "$path" ] || { echo "unsafe completion ancestor: $path" >&2; exit 1; }
              sudo chown root:root -- "$path"
              sudo chmod go-w -- "$path"
            fi
          done
          sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" RUNNER_TEMP="$RUNNER_TEMP" \
            scripts/rust-diff-install.sh --github-disposable-runner \
            "$PWD/target/x86_64-unknown-linux-musl/release/freespace" \
            "$PWD/target/x86_64-unknown-linux-musl/release/freespace" \
            "$RUNNER_TEMP/rust-install-self" "$RUNNER_TEMP/install-self-scratch" "$USER"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-install-self
          path: ${{ runner.temp }}/rust-install-self
          retention-days: 14
          overwrite: true
      - name: without a terminal and without sudo, install.sh hands over to a human
        run: |
          sudo useradd -m nosudo
          cp install.sh /tmp/install.sh
          code=0
          sudo -u nosudo env FREESPACE_RELEASES=/tmp/releases setsid sh /tmp/install.sh < /dev/null 2> esc.log || code=$?
          cat esc.log
          test "$code" = 1
          grep -F "ask a human to run in their terminal: curl -fsSL" esc.log
          test ! -e /usr/local/bin/freespace
      - name: install.sh
        run: |
          FREESPACE_RELEASES=/tmp/releases sh install.sh -- --roots "$PWD/core" --json > install.json 2> install.log
          cat install.log
          grep -E "^freespace $V installed in [0-9]+ s" install.log
          test "$(jq -r .access install.json)" = acl
          test "$(jq -r .scan_started install.json)" = true
          test "$(stat -c '%U %a' /usr/local/bin/freespace)" = "root 755"
          systemctl is-enabled freespace.timer
          test -s /usr/local/share/bash-completion/completions/freespace
          test -s /usr/local/share/zsh/site-functions/_freespace
          test -s /usr/local/share/fish/vendor_completions.d/freespace.fish
          test "$(stat -c %U "$HOME/.claude/skills/freespace/SKILL.md")" = "$USER"
      - name: rerunning install.sh with --version reinstalls in place
        run: |
          FREESPACE_RELEASES=/tmp/releases sh install.sh --version "$V" --no-timer 2> rerun.log
          cat rerun.log
          grep -F "replacing $V" rerun.log
          code=0
          FREESPACE_RELEASES=/tmp/releases sh install.sh --version 9.9.9 2> missing.log || code=$?
          test "$code" = 1
          grep -F "is 9.9.9 a release?" missing.log
      - name: first scan publishes through the unit
        run: |
          for _ in $(seq 60); do
            freespace status --json > status.json 2>/dev/null && [ "$(jq -r .generation status.json)" != null ] && break
            sleep 2
          done
          jq -e '.generation == 1' status.json
          freespace ls "$PWD/core" --json | jq -e '.entries | length > 0'
          test "$(stat -c '%U:%G %a' /var/lib/freespace/snapshot.db)" = "root:freespace 640"
      - name: serve answers from the installed snapshot
        run: |
          freespace serve --port 0 2> serve.log & pid=$!
          for _ in $(seq 50); do grep -q 'http://' serve.log && break; sleep 0.2; done
          url=$(grep -o 'http://[^ ]*' serve.log | head -1)
          port=$(echo "$url" | sed -E 's#http://127.0.0.1:([0-9]+)/.*#\1#')
          token=${url##*t=}
          curl -fsS -H "X-Freespace-Token: $token" "http://127.0.0.1:$port/api/status" | jq -e '.generation == 1'
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$port/api/status")" = 403
          curl -fsS "http://127.0.0.1:$port/" | grep -q '<div id="app">'
          kill "$pid"
          wait "$pid"
      - name: doctor
        run: |
          freespace doctor || true
          freespace doctor --json | jq -e '[.checks[] | select(.id != "path") | .ok] | all'
      # The unit runs with ProtectSystem=strict, which mounts /home, /root and
      # every ReadWritePaths onto itself inside it. The walk goes through such
      # mounts like plain folders (v0.1.0's first scan of / skipped /home).
      - name: a scan in the unit's sandbox walks folders mounted onto themselves
        run: |
          sudo mkdir -p /srv/fsroot/home/u /tmp/fs-sandbox
          sudo dd if=/dev/zero of=/srv/fsroot/home/u/f bs=1M count=4 status=none
          sudo systemd-run --wait --quiet -p ProtectSystem=strict \
            -p ReadWritePaths=/srv/fsroot/home -p ReadWritePaths=/tmp/fs-sandbox \
            -E FREESPACE_SNAPSHOT_DIR=/tmp/fs-sandbox -E FREESPACE_CONFIG=/nonexistent \
            /usr/local/bin/freespace scan /srv/fsroot
          sudo env FREESPACE_SNAPSHOT_DIR=/tmp/fs-sandbox FREESPACE_CONFIG=/nonexistent \
            freespace ls /srv/fsroot/home/u --json | jq -e '.entries | length == 1'
      - name: uninstall leaves only the group
        run: |
          sudo freespace install-timer --uninstall
          for p in /usr/local/bin/freespace /etc/freespace /var/lib/freespace \
                   /etc/systemd/system/freespace.service /etc/systemd/system/freespace.timer \
                   "$HOME/.claude/skills/freespace"; do
            if [ -e "$p" ]; then echo "left behind: $p"; exit 1; fi
          done
          getent group freespace
      # `sudo sh install.sh`: the binary still goes in root-owned, the skill
      # still belongs to the human ($SUDO_USER), not to root
      - name: install.sh under sudo
        run: |
          sudo env FREESPACE_RELEASES=/tmp/releases sh install.sh --no-timer 2> sudo.log
          cat sudo.log
          grep -E "^freespace $V installed in [0-9]+ s" sudo.log
          test "$(stat -c '%U %a' /usr/local/bin/freespace)" = "root 755"
          test "$(stat -c %U "$HOME/.claude/skills/freespace/SKILL.md")" = "$USER"
          test "$(stat -c %U "$HOME/.claude")" = "$USER"
          sudo freespace install-timer --uninstall
          test ! -e /usr/local/bin/freespace
          test ! -e "$HOME/.claude/skills/freespace"
