name: Cleanup threshold research

on:
  workflow_dispatch:
    inputs:
      stage:
        type: choice
        options: [smoke, screen]
        default: smoke
        required: true
      smoke_run_id:
        description: Successful same-source smoke run ID (required for screen)
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: cleanup-threshold-${{ github.ref }}
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.stage == 'screen' && 240 || 60 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check host resource headroom before build
        run: python3 scripts/cleanup_probe_resources.py cleanup-results/provenance/host-resource.json
      - name: Record source and build start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p cleanup-results/provenance cleanup-results/source binaries
          timeout --kill-after=5s 30s gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/${GITHUB_RUN_ATTEMPT}/jobs" > cleanup-results/provenance/job-start.json
          python3 - <<'PYJOB'
          import datetime,json,os
          jobs=json.load(open('cleanup-results/provenance/job-start.json'))['jobs']
          match=[j for j in jobs if j['name']=='experiment' and j['started_at']]
          if len(match)!=1: raise ValueError('cannot identify current job start')
          start=int(datetime.datetime.fromisoformat(match[0]['started_at'].replace('Z','+00:00')).timestamp())
          with open(os.environ['GITHUB_ENV'],'a') as out: out.write(f'CLEANUP_JOB_STARTED_EPOCH={start}\n')
          PYJOB
          date +%s > cleanup-results/provenance/build-start.epoch
          git rev-parse HEAD > cleanup-results/provenance/source-revision.txt
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          printf '%s\n' "$SOURCE_DATE_EPOCH" > cleanup-results/provenance/source-date-epoch.txt
          python3 - <<'PYSOURCE'
          import hashlib,json,pathlib,shutil,subprocess
          selectors=['Cargo.toml','Cargo.lock','rust-toolchain*','.cargo','cli','core',
                     'scripts/bench-v2-container.py','scripts/bench_v2_config.py',
                     'scripts/bench-disk-calibration.py','scripts/bench-v2-container/Dockerfile','web/src','web/index.html',
                     'web/fonts','web/favicon.svg','web/bun.lock','web/package.json',
                     'scripts/cleanup_probe*','scripts/cleanup_oracle.py','scripts/tests/test_cleanup*',
                     '.github/workflows/v2-balance.yml']
          names=subprocess.check_output(['git','ls-files','-z','--',*selectors]).split(b'\0')
          hashes={}
          for raw in filter(None,names):
              name=raw.decode(); source=pathlib.Path(name)
              if source.is_symlink() or not source.is_file(): raise ValueError('unsafe tracked source: '+name)
              target=pathlib.Path('cleanup-results/source')/name
              target.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(source,target)
              hashes[name]=hashlib.sha256(target.read_bytes()).hexdigest()
          if not hashes: raise ValueError('empty source capture')
          pathlib.Path('cleanup-results/provenance/source-sha256.json').write_text(json.dumps(hashes,indent=2,sort_keys=True)+'\n')
          PYSOURCE
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: x86_64-unknown-linux-musl
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install build prerequisites
        run: |
          sudo timeout --kill-after=5s 180s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 --error-on=any update -q
          sudo env DEBIAN_FRONTEND=noninteractive timeout --kill-after=5s 180s apt-get install -yq --no-install-recommends musl-tools
      - name: Run contracts and build frozen comparison arms
        env:
          RUSTUP_TOOLCHAIN: 1.99.1
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p 'test_cleanup*.py'
          python3 -m compileall -q scripts/cleanup_probe_*.py scripts/cleanup_oracle.py
          bash -n scripts/cleanup_probe_runner.sh
          (cd web && bun install --frozen-lockfile)
          cargo test --workspace --all-targets --locked --target x86_64-unknown-linux-musl
          cargo build -p freespace --release --locked --target x86_64-unknown-linux-musl --bin freespace --example cleanup_probe
          cp target/x86_64-unknown-linux-musl/release/freespace binaries/freespace
          cp target/x86_64-unknown-linux-musl/release/examples/cleanup_probe binaries/cleanup_probe
          sha256sum binaries/freespace binaries/cleanup_probe > cleanup-results/provenance/binaries.sha256
          cp binaries/freespace binaries/cleanup_probe cleanup-results/provenance/
          rustc -Vv > cleanup-results/provenance/rustc.txt
          bun --version > cleanup-results/provenance/bun.txt
          printf '%s\n' 'target=x86_64-unknown-linux-musl' 'allocator=mimalloc' 'profile=release --locked' > cleanup-results/provenance/build-context.txt
          date +%s > cleanup-results/provenance/build-end.epoch
      - name: Verify referenced smoke run
        if: inputs.stage == 'screen'
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_RUN_ID: ${{ inputs.smoke_run_id }}
        run: |
          set -euo pipefail
          [[ $SMOKE_RUN_ID =~ ^[0-9]+$ ]]
          timeout --kill-after=5s 30s gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SMOKE_RUN_ID" > cleanup-results/provenance/smoke-run.json
          python3 - <<'PY'
          import json,os
          r=json.load(open('cleanup-results/provenance/smoke-run.json'))
          assert r['id']==int(os.environ['SMOKE_RUN_ID']) and r['head_sha']==os.environ['GITHUB_SHA']
          assert r['event']=='workflow_dispatch' and r['conclusion']=='success' and r['run_attempt']==1
          assert r['workflow_id']==397616649 and r['head_branch']=='perf/cleanup-threshold-probe'
          PY
      - uses: actions/download-artifact@v4
        if: inputs.stage == 'screen'
        with:
          name: cleanup-threshold-smoke
          path: smoke-evidence
          github-token: ${{ github.token }}
          run-id: ${{ inputs.smoke_run_id }}
          repository: ${{ github.repository }}
      - name: Admit screen from same-source smoke
        if: inputs.stage == 'screen'
        run: |
          set -euo pipefail
          cmp smoke-evidence/provenance/binaries.sha256 cleanup-results/provenance/binaries.sha256
          python3 scripts/cleanup_probe_forecast.py smoke-evidence/measurements/manifest.json cleanup-results/provenance/screen-forecast.json
      - name: Prepare and measure
        timeout-minutes: ${{ inputs.stage == 'screen' && 210 || 45 }}
        env:
          CLEANUP_STAGE: ${{ inputs.stage }}
          CLEANUP_IO: local
          CLEANUP_OUTPUT: ${{ github.workspace }}/cleanup-results
          STEP_SECONDS: ${{ inputs.stage == 'screen' && 12600 || 2700 }}
          JOB_SECONDS: ${{ inputs.stage == 'screen' && 14400 || 3600 }}
          CLEANUP_SMOKE_RUNTIME: ${{ github.workspace }}/smoke-evidence/provenance/runtime.json
          CLEANUP_SMOKE_IMAGE: ${{ github.workspace }}/smoke-evidence/provenance/runtime-image.tar.gz
        run: |
          set -euo pipefail
          export CLEANUP_STEP_STARTED_EPOCH=$(date +%s)
          export CLEANUP_STEP_OUTER_AVAILABLE=$(df -B1 --output=avail "$RUNNER_TEMP" | tail -1 | tr -d ' ')
          export CLEANUP_STEP_RESULTS_AVAILABLE=$(df -B1 --output=avail "$GITHUB_WORKSPACE" | tail -1 | tr -d ' ')
          step_deadline=$((CLEANUP_STEP_STARTED_EPOCH + STEP_SECONDS))
          job_deadline=$((CLEANUP_JOB_STARTED_EPOCH + JOB_SECONDS - 300))
          export CLEANUP_STEP_DEADLINE_EPOCH=$((step_deadline < job_deadline ? step_deadline : job_deadline))
          bash scripts/cleanup_probe_runner.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cleanup-threshold-${{ inputs.stage }}
          path: cleanup-results/
          include-hidden-files: true
          retention-days: 14
