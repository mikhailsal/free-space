name: Resource cause diagnostic

on:
  workflow_dispatch:
    inputs:
      diagnostic_stage:
        description: Diagnostic stage
        type: choice
        options: [smoke, screen]
        default: smoke
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: resource-cause-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record and verify frozen artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
          DIAGNOSTIC_STAGE: ${{ inputs.diagnostic_stage }}
        run: |
          set -euo pipefail
          mkdir -p cause-results/provenance
          timeout --kill-after=5s 30s gh api "repos/$GITHUB_REPOSITORY/actions/runs/41277463149" > cause-results/provenance/source-run.json
          timeout --kill-after=5s 30s gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13071807048" > cause-results/provenance/source-artifact.json
          python3 - <<'PY'
          import json, os, pathlib
          p=pathlib.Path('cause-results/provenance')
          for name in ('source-run.json', 'source-artifact.json'):
              if (p/name).stat().st_size > 1024*1024: raise ValueError(f'oversized API response: {name}')
          run=json.loads((p/'source-run.json').read_text())
          artifact=json.loads((p/'source-artifact.json').read_text())
          assert run['id']==41277463149 and run['head_sha']=='4f22bf8e3b67f7f59049a72116b90c061fb1328b'
          assert run['conclusion']=='success' and run['event']=='workflow_dispatch' and run['run_attempt']==1
          assert artifact['id']==13071807048 and artifact['name']=='representative-binary' and artifact['expired'] is False
          assert artifact['workflow_run']['id']==run['id']
          context={key:os.environ.get(key) for key in ('GITHUB_REPOSITORY','GITHUB_REF','GITHUB_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','GITHUB_WORKFLOW','RUNNER_ENVIRONMENT','DIAGNOSTIC_STAGE')}
          (p/'diagnostic-context.json').write_text(json.dumps(context,indent=2)+'\n')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: representative-binary
          path: binaries
          github-token: ${{ github.token }}
          run-id: 41277463149
          repository: ${{ github.repository }}
      - name: Verify baseline and diagnostic contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,shutil
          p=pathlib.Path('binaries')
          baseline=p/'baseline'
          digest=hashlib.sha256(baseline.read_bytes()).hexdigest()
          revision=(p/'baseline.revision.txt').read_text().strip()
          build=json.loads((p/'baseline.build.json').read_text())
          assert digest=='ed2a1cb138b1e48e70a388a4a8fda3e79fcfd2e37fd0c061d41d2d6363f8e980'
          assert revision=='e8265778ef78ec4acd9da1375eedb0be37a123f5'
          assert build['sha256']==digest and build['source_revision']==revision
          assert build['target']=='x86_64-unknown-linux-musl'
          assert str(build['flags']['SOURCE_DATE_EPOCH'])=='1793464183'
          for name in ('baseline','baseline.revision.txt','baseline.build.json'):
              shutil.copy2(p/name,pathlib.Path('cause-results/provenance')/name)
          PY
          python3 -m unittest discover -s scripts/tests -p 'test_bench*.py'
          python3 -m unittest discover -s scripts/tests -p 'test_cause*.py'
          python3 -m compileall -q scripts/cause_*.py
          bash -n scripts/cause_runner.sh
      - name: Prepare and measure resource causes
        timeout-minutes: 45
        env:
          DIAGNOSTIC_STAGE: ${{ inputs.diagnostic_stage }}
          BENCH_IO: local
          BENCH_OUTPUT: ${{ github.workspace }}/cause-results
          BENCH_PREP_RECEIPT: ${{ github.workspace }}/cause-results/runner-preparation/receipt.json
        run: |
          set -euo pipefail
          export CAUSE_STEP_STARTED_EPOCH=$(date +%s)
          export CAUSE_STEP_DEADLINE_EPOCH=$((CAUSE_STEP_STARTED_EPOCH + 2700))
          mkdir -p cause-results/runner-preparation
          python3 - <<'PYDEADLINE'
          import json, os
          with open('cause-results/deadline.json', 'w') as out:
              json.dump({'started_epoch': int(os.environ['CAUSE_STEP_STARTED_EPOCH']),
                         'deadline_epoch': int(os.environ['CAUSE_STEP_DEADLINE_EPOCH']),
                         'cleanup_reserve_seconds': 240, 'host_budget_seconds': None,
                         'host_outer_timeout_seconds': None}, out, indent=2)
          PYDEADLINE
          status=0
          timeout --kill-after=5s 270s python3 scripts/bench_v1_runner_prepare.py || status=$?
          if [[ -f representative-results/runner-preparation/receipt.json ]]; then
            cp representative-results/runner-preparation/receipt.json "$BENCH_PREP_RECEIPT"
          fi
          if (( status != 0 )); then
            if [[ ! -f $BENCH_PREP_RECEIPT ]]; then
              PREP_EXIT_CODE="$status" python3 - <<'PYRECEIPT'
          import json, os
          with open(os.environ['BENCH_PREP_RECEIPT'], 'w') as out:
              json.dump({'success': False, 'exit_code': int(os.environ['PREP_EXIT_CODE']),
                         'error': 'preparation ended without a receipt'}, out, indent=2)
          PYRECEIPT
            fi
            echo "Runner preparation failed: $status" >&2
            exit "$status"
          fi
          bash scripts/cause_runner.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resource-cause-${{ inputs.diagnostic_stage }}
          path: cause-results/
          retention-days: 14
