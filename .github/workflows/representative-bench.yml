name: Representative scanner benchmark

on:
  push:
    branches: [perf/representative-gh-bench]
    paths:
      - .github/workflows/representative-bench.yml
      - scripts/bench*.py
      - scripts/summarize-v2-container.py
      - scripts/bench-representative.sh
      - scripts/bench-v2-container/**
      - scripts/tests/test_bench*.py
  workflow_dispatch:
    inputs:
      stage:
        description: Admission stage (local-scale requires screening forecast)
        type: choice
        options: [smoke, screen, local-scale]
        default: smoke
      operation:
        description: Benchmark operation (auto uses stage defaults)
        type: choice
        options: [auto, scan, refresh]
        default: auto
      target:
        description: Compilation target for both benchmark arms
        type: choice
        options: [x86_64-unknown-linux-gnu, x86_64-unknown-linux-musl]
        default: x86_64-unknown-linux-gnu
      subtree_entries:
        description: Refresh subtree entries including the directory
        type: choice
        options: ['100', '10000', '100000']
        default: '100'
      scenario:
        description: Changed requires refresh-only operation
        type: choice
        options: [unchanged, changed]
        default: unchanged
      memory_mib:
        description: Ordinary successful-operation memory limit (MiB)
        type: choice
        options: ['512', '1024', '2048', '4096']
        default: '4096'
      io:
        description: Runner I/O sensitivity, not an exact local-disk replica
        type: choice
        options: [native, local, limited]
        default: native
      comparison:
        description: Identical baseline controls, or baseline versus candidate
        type: choice
        options: [control, candidate]
        default: control
      baseline:
        description: Immutable product baseline revision
        type: string
        default: afce6fd
      timeout_minutes:
        description: Optional lower measured-step cap within the stage maximum
        type: string
        default: ''
      forecast_seconds:
        description: Required measured screening forecast for local-scale, including setup/observers
        type: string
        default: '0'
      forecast_case_id:
        description: Canonical case ID corresponding to the local-scale forecast
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: representative-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      paired_job_minutes: ${{ steps.policy.outputs.job_minutes }}
      paired_step_minutes: ${{ steps.policy.outputs.step_minutes }}
      maximum_runner_minutes: ${{ steps.policy.outputs.maximum_runner_minutes }}
      operations: ${{ steps.policy.outputs.operations }}
      target: ${{ steps.policy.outputs.target }}
      subtree_entries: ${{ steps.policy.outputs.subtree_entries }}
      scenario: ${{ steps.policy.outputs.scenario }}
      memory_mib: ${{ steps.policy.outputs.memory_mib }}
      files: ${{ steps.policy.outputs.files }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate per-stage time envelope
        id: policy
        env:
          STAGE: ${{ inputs.stage || 'smoke' }}
          REQUESTED_MINUTES: ${{ inputs.timeout_minutes }}
          OPERATION: ${{ inputs.operation || 'auto' }}
          TARGET: ${{ inputs.target || 'x86_64-unknown-linux-gnu' }}
          SUBTREE: ${{ inputs.subtree_entries || '100' }}
          SCENARIO: ${{ inputs.scenario || 'unchanged' }}
          MEMORY: ${{ inputs.memory_mib || '4096' }}
          BASE_REF: ${{ inputs.baseline || 'afce6fd' }}
        run: |
          python3 - <<'PY'
          import os,sys
          sys.path.insert(0,'scripts')
          from bench_v1_admission import baseline_epoch,benchmark_target,qualification_case,stage_files,stage_operations,stage_timeouts
          policy=stage_timeouts(os.environ['STAGE'],os.environ.get('REQUESTED_MINUTES'))
          operations=stage_operations(os.environ['STAGE'],os.environ['OPERATION'])
          files=stage_files(os.environ['STAGE'])
          policy['files']=files
          policy.update(qualification_case(os.environ['SUBTREE'],os.environ['SCENARIO'],os.environ['MEMORY'],operations,files))
          policy['operations']=' '.join(operations)
          policy['target']=benchmark_target(os.environ['TARGET'])
          policy['baseline_revision'],policy['source_date_epoch']=baseline_epoch(os.environ['BASE_REF'])
          with open(os.environ['GITHUB_ENV'],'a') as stream:
              stream.write(f"SOURCE_DATE_EPOCH={policy['source_date_epoch']}\n")
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
              stream.write(''.join(f'{key}={value}\n' for key,value in policy.items()))
          print(policy)
          PY
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
          targets: ${{ steps.policy.outputs.target }}
      - name: Install musl tools
        if: steps.policy.outputs.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo timeout 180 apt-get update -q
          sudo env DEBIAN_FRONTEND=noninteractive timeout 180 apt-get install -yq --no-install-recommends musl-tools
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ steps.policy.outputs.target }}-${{ steps.policy.outputs.source_date_epoch }}
      - name: Check benchmark contracts and repository gates
        env:
          BENCH_TARGET: ${{ steps.policy.outputs.target }}
          RUSTUP_TOOLCHAIN: 1.99.1
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_bench*.py'
          python3 -m compileall -q scripts/bench_v1*.py
          cd web && bun install --frozen-lockfile
          cd .. && scripts/check.sh
          cargo test --workspace --locked --target "$BENCH_TARGET"
      - name: Build both arms with one recorded toolchain
        env:
          BASE_REF: ${{ steps.policy.outputs.baseline_revision }}
          COMPARISON: ${{ inputs.comparison || 'control' }}
          RUSTUP_TOOLCHAIN: 1.99.1
          BENCH_TARGET: ${{ steps.policy.outputs.target }}
        run: |
          set -euo pipefail
          mkdir binaries
          git rev-parse HEAD > binaries/candidate.revision.txt
          cargo build --release --locked -p freespace --target "$BENCH_TARGET"
          cp "target/$BENCH_TARGET/release/freespace" binaries/candidate
          if [[ $COMPARISON == control ]]; then
            cp binaries/candidate binaries/baseline
            cp binaries/candidate.revision.txt binaries/baseline.revision.txt
          else
            git worktree add --detach "$RUNNER_TEMP/baseline-source" "$BASE_REF"
            git -C "$RUNNER_TEMP/baseline-source" rev-parse HEAD > binaries/baseline.revision.txt
            (cd "$RUNNER_TEMP/baseline-source" && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" \
              cargo build --release --locked -p freespace --target "$BENCH_TARGET")
            cp "target/$BENCH_TARGET/release/freespace" binaries/baseline
          fi
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,tomllib
          compiler=subprocess.check_output(['rustc','-Vv'],text=True)
          host=next(x.split(': ',1)[1] for x in compiler.splitlines() if x.startswith('host: '))
          target=os.environ['BENCH_TARGET']
          for arm in ('baseline','candidate'):
              p=pathlib.Path('binaries')/arm
              root=(pathlib.Path(os.environ['RUNNER_TEMP'])/'baseline-source'
                    if arm=='baseline' and os.environ['COMPARISON']=='candidate' else pathlib.Path.cwd())
              release=tomllib.loads((root/'Cargo.toml').read_text()).get('profile',{}).get('release',{})
              config={str(path.relative_to(root)):path.read_text() for path in
                      (root/'.cargo/config',root/'.cargo/config.toml') if path.is_file()}
              record={'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
                      'source_revision':p.with_name(arm+'.revision.txt').read_text().strip(),
                      'compiler':compiler,'compiler_host':host,'target':target,'profile':'release --locked',
                      'flags':{k:os.environ.get(k,'') for k in ('RUSTFLAGS','CARGO_ENCODED_RUSTFLAGS','SOURCE_DATE_EPOCH')},
                      'release_profile':release,'cargo_config':config,
                      'bun':subprocess.check_output(['bun','--version'],text=True).strip()}
              p.with_name(arm+'.build.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: representative-binary
          path: binaries/
          retention-days: 7

  paired:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(needs.build.outputs.paired_job_minutes) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: representative-binary
          path: binaries
      - name: Check time admission before local-scale allocation
        if: inputs.stage == 'local-scale'
        env:
          FORECAST: ${{ inputs.forecast_seconds }}
          STEP_CAP: ${{ needs.build.outputs.paired_step_minutes }}
          OPERATIONS: ${{ needs.build.outputs.operations }}
          TARGET: ${{ needs.build.outputs.target }}
          IO: ${{ inputs.io || 'native' }}
          SUBTREE: ${{ needs.build.outputs.subtree_entries }}
          SCENARIO: ${{ needs.build.outputs.scenario }}
          MEMORY: ${{ needs.build.outputs.memory_mib }}
          FORECAST_CASE: ${{ inputs.forecast_case_id }}
        run: |
          python3 - <<'PY'
          import json,math,os,sys
          sys.path.insert(0,'scripts')
          from bench_v1_admission import admit_time,forecast_case_id
          receipt={'success':False,'estimated_seconds':None,'case_id':None,'case_matches':False,
                   'forecast_case_id':os.environ.get('FORECAST_CASE',''),
                   'case':{k:os.environ.get(k) for k in ('TARGET','IO','OPERATIONS','SUBTREE','SCENARIO','MEMORY')}}
          try:
              forecast=float(os.environ['FORECAST'])
              if not math.isfinite(forecast): raise ValueError('forecast must be finite')
              receipt.update(admit_time(int(os.environ['STEP_CAP'])*60,forecast))
              case=forecast_case_id(os.environ['TARGET'],os.environ['IO'],os.environ['OPERATIONS'].split(),os.environ['SUBTREE'],os.environ['SCENARIO'],os.environ['MEMORY'])
              receipt.update(case_id=case,case_matches=case==receipt['forecast_case_id'])
              if not receipt['case_matches']:
                  receipt.update(success=False,error='forecast case does not match')
          except (KeyError,ValueError,OverflowError) as error:
              receipt.update(success=False,error=str(error))
          for key,value in list(receipt.items()):
              if isinstance(value,float) and not math.isfinite(value):
                  receipt.update({key:None,'success':False,'error':'non-finite admission value'})
          os.makedirs('representative-results',exist_ok=True)
          with open('representative-results/forecast-admission.json','w') as out: json.dump(receipt,out,indent=2,allow_nan=False)
          print(receipt)
          if not receipt['success'] or not receipt['case_matches']: raise SystemExit('No admissible case-matched screening forecast')
          PY
      - name: Prepare ephemeral runner disk when needed
        timeout-minutes: 5
        run: |
          mkdir -p representative-results/runner-preparation
          prep_started=$SECONDS
          status=0
          timeout --kill-after=5s 270s python3 scripts/bench_v1_runner_prepare.py || status=$?
          if (( status != 0 )); then
            PREP_EXIT_CODE="$status" PREP_ELAPSED="$((SECONDS-prep_started))" python3 - <<'PY' || true
          import json,os,sys
          sys.path.insert(0,'scripts')
          from bench_v1_admission import GIB,V1_HARD_FLOOR_GIB,V1_PREP_HEADROOM_GIB
          path='representative-results/runner-preparation/receipt.json'
          try:
              with open(path) as source: receipt=json.load(source)
          except (OSError,ValueError): receipt={'before':None,'actions':[],'errors':[]}
          target=os.environ.get('RUNNER_TEMP')
          try:
              if not target or not os.path.isabs(target) or os.path.realpath(target) != target:
                  raise ValueError('invalid RUNNER_TEMP')
              info=os.stat(target); s=os.statvfs(target)
              disk={'total_bytes':s.f_blocks*s.f_frsize,'used_bytes':(s.f_blocks-s.f_bfree)*s.f_frsize,'available_bytes':s.f_bavail*s.f_frsize}
              receipt['target_dev']=info.st_dev
          except (OSError,ValueError) as error:
              disk={'error':str(error)}
          status=int(os.environ['PREP_EXIT_CODE'])
          receipt.update(success=False,after=disk,target_path=target,floor_bytes=V1_HARD_FLOOR_GIB*GIB,
                         target_bytes=(V1_HARD_FLOOR_GIB+V1_PREP_HEADROOM_GIB)*GIB,
                         duration_seconds=int(os.environ['PREP_ELAPSED']),exit_code=status,
                         timed_out=status==124 or (status==137 and int(os.environ['PREP_ELAPSED'])>=270),possibly_killed=status==137)
          for action in receipt.get('actions',[]):
              if action.get('status') == 'started': action.update(status='interrupted',duration_seconds=None,root_process_state_unknown=True)
          receipt.setdefault('errors',[]).append(f'preparation command failed with exit {status}')
          tmp=path+'.tmp'
          with open(tmp,'w') as out: json.dump(receipt,out,allow_nan=False,indent=2)
          os.replace(tmp,path)
          PY
            exit "$status"
          fi
      - name: Summarize runner disk preparation
        if: always()
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          path=pathlib.Path('representative-results/runner-preparation/receipt.json')
          if path.is_file():
              r=json.loads(path.read_text())
              before=(r.get('before') or {}).get('available_bytes')
              after=(r.get('after') or {}).get('available_bytes')
              freed=after-before if isinstance(after,int) and isinstance(before,int) else None
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
                  out.write(f"\nRunner preparation: success={r.get('success')}; possibly_modified={any(a.get('status') in ('started','removed','error','interrupted') for a in r.get('actions',[]))}; freed_bytes={freed}; duration_seconds={r.get('duration_seconds')}. Receipt: runner-preparation/receipt.json in run artifact.\n")
          PY
      - name: Paired v1 commands with isolated observers
        timeout-minutes: ${{ fromJSON(needs.build.outputs.paired_step_minutes) }}
        env:
          BENCH_PROTOCOL: v1-pairs
          BENCH_IO: ${{ inputs.io || 'native' }}
          STAGE: ${{ inputs.stage || 'smoke' }}
          OPERATIONS: ${{ needs.build.outputs.operations }}
          BENCH_TARGET: ${{ needs.build.outputs.target }}
          BENCH_SUBTREE_ENTRIES: ${{ needs.build.outputs.subtree_entries }}
          BENCH_SCENARIO: ${{ needs.build.outputs.scenario }}
          BENCH_MEMORY: ${{ needs.build.outputs.memory_mib }}
          BENCH_FILES: ${{ needs.build.outputs.files }}
          BENCH_PREP_RECEIPT: ${{ github.workspace }}/representative-results/runner-preparation/receipt.json
        run: |
          set -euo pipefail
          case "$OPERATIONS" in
            scan|refresh|'scan refresh') ;;
            *) echo 'Invalid benchmark operations' >&2; exit 1 ;;
          esac
          case $STAGE in
            smoke) export BENCH_PAIRS=1 BENCH_COMMAND_TIMEOUT=600 ;;
            screen) export BENCH_PAIRS=3 BENCH_COMMAND_TIMEOUT=1200 ;;
            local-scale) export BENCH_PAIRS=1 BENCH_COMMAND_TIMEOUT=1800 ;;
          esac
          for operation in $OPERATIONS; do
            BENCH_OPERATION=$operation BENCH_OUTPUT="$PWD/representative-results/$operation" \
              bash scripts/bench-representative.sh
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: representative-v1-${{ inputs.stage || 'smoke' }}-${{ inputs.io || 'native' }}-${{ needs.build.outputs.target }}
          path: representative-results/
          retention-days: 14
